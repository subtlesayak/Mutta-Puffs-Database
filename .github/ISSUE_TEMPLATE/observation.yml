name: Report a price or fresh batch
description: Add a dated price, egg portion, batch time or availability
title: "Report a puff detail: "
body:
  - type: input
    id: place_id
    attributes: {label: Atlas place ID}
    validations: {required: true}
  - type: input
    id: observed_on
    attributes: {label: Observation date, placeholder: YYYY-MM-DD}
    validations: {required: true}
  - type: input
    id: price
    attributes: {label: Price per puff, description: Include the amount and three-letter currency code., placeholder: 25 INR}
  - type: dropdown
    id: egg_portion
    attributes: {label: Egg portion, options: [Whole egg, Half egg, Eggless, Other]}
  - type: input
    id: fresh_batch_times
    attributes: {label: Fresh batch times, description: 'Use local 24-hour times, separated by commas.', placeholder: '08:00, 16:30'}
  - type: dropdown
    id: availability
    attributes: {label: Availability, options: [Available, Sold out, No longer sold]}
  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: These are my observations and I can share them under CC BY 4.0.
          required: true
